#cloud-config
# Triple A Super Chatbot — OCI VM Bootstrap
# Runs automatically on first boot. Installs all system dependencies,
# Ollama, and sets up the systemd service skeleton.
# Terraform provisioners handle the actual app upload and start.

package_update: true
package_upgrade: false

packages:
  - python3
  - python3-pip
  - python3-venv
  - git
  - curl
  - build-essential
  - libssl-dev
  - libffi-dev
  - python3-dev

runcmd:
  # ── Install Ollama (supports ARM aarch64 natively) ─────────────────────────
  - curl -fsSL https://ollama.com/install.sh | sh

  # ── Enable and start Ollama as a systemd service ───────────────────────────
  - systemctl enable ollama
  - systemctl start ollama

  # ── Wait for Ollama API to be ready ───────────────────────────────────────
  - |
    echo "Waiting for Ollama to become ready..."
    for i in $(seq 1 30); do
      if curl -sf http://localhost:11434 > /dev/null 2>&1; then
        echo "Ollama is ready."
        break
      fi
      echo "  attempt $i/30 — sleeping 5s..."
      sleep 5
    done

  # ── Pull required models (synchronous — takes 10-20 min on first boot) ────
  # HOME must be set explicitly — cloud-init runs without a home directory
  - echo "Pulling qwen3 model (~5 GB)..."
  - HOME=/root ollama pull qwen3
  - echo "Pulling nomic-embed-text model (~274 MB)..."
  - HOME=/root ollama pull nomic-embed-text
  - echo "All Ollama models downloaded."

  # ── Create app directory with correct ownership ────────────────────────────
  - mkdir -p /opt/chatbot/mvp_demo
  - chown -R ubuntu:ubuntu /opt/chatbot

  # ── Open port 8000 in Ubuntu firewall (OCI uses its own security list) ─────
  - iptables -I INPUT -p tcp --dport 8000 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 80 -j ACCEPT

final_message: |
  cloud-init complete. Ollama is running and models are downloaded.
  Terraform provisioners will now upload the app and start Gunicorn.

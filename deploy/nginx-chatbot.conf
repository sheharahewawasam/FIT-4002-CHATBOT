# Triple A Super chatbot - reverse proxy.
# Gunicorn listens on 127.0.0.1:8000 only; port 8000 is closed at the
# security group and not reachable from outside.

upstream chatbot_app {
    server 127.0.0.1:8000;
}

server {
    # Certbot redirected only when the Host matched the certificate name, but
    # this is also the default server for port 80, so a request to the bare IP
    # fell through it and was served over plain HTTP - passwords included.
    # Everything on 80 now goes to the canonical name over TLS.
    return 301 https://triple-a-chatbot.duckdns.org$request_uri;


    listen 80;
    listen [::]:80;
    server_name triple-a-chatbot.duckdns.org;

    # Uploads are capped at 25MB in documents.py. nginx defaults to 1MB, which
    # would reject a large trust deed with a 413 before Django ever saw it.
    client_max_body_size 25M;

    location / {
        proxy_pass http://chatbot_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A chat query runs retrieval, reranking and CPU-only generation, which
        # measured 170-230s on this instance. nginx defaults to 60s and would
        # return 504 long before the answer arrived.
        proxy_connect_timeout 30s;
        proxy_send_timeout   600s;
        proxy_read_timeout   600s;
    }


}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name triple-a-chatbot.duckdns.org;

    # Self-signed: Let's Encrypt will not issue for a bare IP, nor for an
    # amazonaws.com hostname. Replace via certbot once a real domain points here.
    ssl_certificate /etc/letsencrypt/live/triple-a-chatbot.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/triple-a-chatbot.duckdns.org/privkey.pem; # managed by Certbot
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 25M;

    location / {
        proxy_pass http://chatbot_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout   600s;
        proxy_read_timeout   600s;
    }

}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advisor RAG Chatbot MVP</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 600px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 80vh; }
        .header { background: #0056b3; color: white; padding: 15px; border-radius: 10px 10px 0 0; text-align: center; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px; border-radius: 8px; line-height: 1.4; }
        .user-msg { background: #e1f5fe; align-self: flex-end; border: 1px solid #b3e5fc; }
        .bot-msg { background: #f5f5f5; align-self: flex-start; border: 1px solid #e0e0e0; }
        .citations { font-size: 0.8em; color: #555; margin-top: 8px; padding-top: 8px; border-top: 1px solid #ddd; }
        .citations a { color: #0056b3; text-decoration: none; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid #ddd; background: #fff; border-radius: 0 0 10px 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-right: 10px; outline: none; }
        button { padding: 10px 20px; background: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #004494; }   
        .loading { align-self: flex-start; color: #888; font-style: italic; display: none; }
        .selector-group select {
            width: 180px;
            padding: 8px;
            border-radius: 6px;
            border: none;
            outline: none;
            background: white;
            font-size: 0.9em;
        }

        .checkbox-group {
            background: white;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            color: #333;
        }

        .checkbox-label input[type="checkbox"] {
            cursor: pointer;
        }
            /* --- Documents panel ------------------------------------------- */
        body { flex-wrap: wrap; align-items: flex-start; gap: 20px; }
        .docs-panel {
            width: 340px; background: white; border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex;
            flex-direction: column; max-height: 80vh;
        }
        .docs-panel .header { border-radius: 10px 10px 0 0; }
        .docs-body { padding: 15px; overflow-y: auto; }
        .docs-body label { display: block; font-size: 0.8em; color: #555; margin: 10px 0 4px; }
        .docs-body input[type="file"], .docs-body select, .docs-body input[type="text"] {
            width: 100%; padding: 8px; border: 1px solid #ccc;
            border-radius: 5px; box-sizing: border-box; font-size: 0.9em;
        }
        .docs-body button { width: 100%; margin-top: 12px; }
        .docs-body button:disabled { background: #9bb8d6; cursor: not-allowed; }
        .upload-msg { font-size: 0.8em; margin-top: 8px; min-height: 1em; }
        .doc-list { list-style: none; padding: 0; margin: 14px 0 0; }
        .doc-item {
            border: 1px solid #e0e0e0; border-radius: 6px; padding: 8px;
            margin-bottom: 8px; font-size: 0.82em;
        }
        .doc-name { font-weight: 600; word-break: break-all; }
        .doc-meta { color: #666; margin-top: 3px; }
        .doc-actions { margin-top: 6px; }
        .doc-actions button {
            width: auto; padding: 3px 10px; font-size: 0.9em;
            margin: 0; background: #c0392b;
        }
        .badge {
            display: inline-block; padding: 1px 7px; border-radius: 10px;
            font-size: 0.9em; color: white;
        }
        .badge-pending, .badge-processing { background: #f39c12; }
        .badge-ready { background: #27ae60; }
        .badge-failed { background: #c0392b; }
        .divider { border-top: 1px solid #eee; margin: 14px 0 0; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h2>Triple A Super Advisor AI</h2>
        <div class="toolbar">
            <div class="selector-group">
                <label for="user">User</label>
                <select id="user">
                    <option value="">Select user...</option>
                    <option value="John">John</option>
                    <option value="Emily">Emily</option>
                    <option value="Jake">Jake</option>
                </select>
            </div>

            <div class="selector-group">
                <label>Knowledge Sources</label>
                <div class="checkbox-group">
                    <span class="checkbox-label">
                        Select a user to view available funds
                    </span>
                </div>
            </div>
        </div>
    </div>
    <div class="chat-box" id="chat-box">
        <div class="message bot-msg">Hello. I am the internal RAG assistant. Ask me a question about our project documents.</div>
        <div class="loading" id="loading">Searching knowledge base...</div>
    </div>
    <div class="input-area">
        <input type="text" id="query-input" placeholder="e.g., What is the purpose of the RAG chatbot?" onkeypress="handleKeyPress(event)">
        <button onclick="sendQuery()">Ask</button>
    </div>
</div>


<div class="docs-panel">
    <div class="header"><h2 style="font-size:1.1em;margin:0;">Documents</h2></div>
    <div class="docs-body">
        <div id="docs-locked" style="color:#666;font-size:0.9em;">
            Select a user to upload and view documents.
        </div>

        <div id="docs-active" style="display:none;">
            <label for="doc-file">PDF file (max 25 MB)</label>
            <input type="file" id="doc-file" accept="application/pdf">

            <label for="doc-fund">Fund</label>
            <select id="doc-fund"><option value="">No fund (private to you)</option></select>

            <label for="doc-kind">Document type</label>
            <input type="text" id="doc-kind" placeholder="e.g. Trust Deed">

            <button id="doc-upload-btn" onclick="uploadDocument()">Upload &amp; ingest</button>
            <div class="upload-msg" id="upload-msg"></div>

            <div class="divider"></div>
            <ul class="doc-list" id="doc-list"></ul>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://127.0.0.1:8000/api/chat/'; 

    function handleKeyPress(e) {
        if(e.key === 'Enter') sendQuery();
    }

    async function sendQuery() {
        const inputField = document.getElementById('query-input');
        const query = inputField.value.trim();
        if(!query) return;

        const selectedUser = document.getElementById('user').value; 
        if (!selectedUser) { addMessage("Please select a user first.", 'bot-msg'); return; }

        // Get all selected funds
        const selectedFunds = Array.from(
            document.querySelectorAll('input[name="doc-type"]:checked')
        ).map(cb => cb.value);

        addMessage(query, 'user-msg');
        inputField.value = '';
        
        const loading = document.getElementById('loading');
        loading.style.display = 'block';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    query: query,
                    funds: selectedFunds,
                    user: selectedUser
                 })
            });

            loading.style.display = 'none';

            if (response.status === 429) {
                const retryAfter = parseInt(response.headers.get('Retry-After'), 10);
                console.log(response.headers.get('Retry-After'));
                if (!isNaN(retryAfter) && retryAfter > 0) {
                    startRateLimitCountdown(retryAfter);
                } else {
                    addMessage("You're sending messages too quickly. Please wait a moment and try again.", 'bot-msg');
                }
                return;
            }

            const data = await response.json();

            if(!response.ok || data.error) {
                addMessage("Error: " + (data.error || data.detail || 'Someting went wrong'), 'bot-msg');
            } else {
                addBotMessageWithCitations(data.answer, data.citations);
            }
        } catch (error) {
            loading.style.display = 'none';
            addMessage("Failed to connect to the server.", 'bot-msg');
        }
    }

    function startRateLimitCountdown(seconds) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message bot-msg';
        chatBox.insertBefore(msgDiv, document.getElementById('loading'));
        chatBox.scrollTop = chatBox.scrollHeight;

        const inputField = document.getElementById('query-input');
        const askButton = document.querySelector('.input-area button');
        inputField.disabled = true;
        askButton.disabled = true;

        let remaining = seconds;

        function render() {
            msgDiv.textContent = `You're sending messages too quickly. Please wait ${remaining}s before trying again.`;
        }

        render();
        const interval = setInterval(() => {
            remaining -= 1;
            if (remaining <= 0) {
                clearInterval(interval);
                msgDiv.textContent = "You can send messages again now.";
                inputField.disabled = false;
                askButton.disabled = false;
                inputField.focus();
            } else {
                render();
            }
        }, 1000);
    }

    function addMessage(text, className) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        chatBox.insertBefore(msgDiv, document.getElementById('loading'));
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addBotMessageWithCitations(answer, citations) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message bot-msg';
        
        let htmlContent = `<div class="answer-text">${answer.replace(/\n/g, '<br>')}</div>`;
        
        if (citations && citations.length > 0) {
            // Deduplicate citations based on source_url
            const uniqueCitations = Array.from(new Set(citations.map(c => c.source)))
                                         .map(src => citations.find(c => c.source === src));
                                         
            htmlContent += `<div class="citations"><strong>Sources:</strong><ul>`;
            uniqueCitations.forEach(cit => {
                htmlContent += `<li><a href="../${cit.source.split('/').pop()}" target="_blank" style="color:#0056b3;">${cit.source.split('/').pop()}</a> (${cit.fund})</li>`;
            });
            htmlContent += `</ul></div>`;
        }
        
        msgDiv.innerHTML = htmlContent;
        chatBox.insertBefore(msgDiv, document.getElementById('loading'));
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    const API_BASE = 'http://127.0.0.1:8000/users';

    document.addEventListener('DOMContentLoaded', () => {
        const userSelect = document.getElementById('user');
        const checkboxGroup = document.querySelector('.checkbox-group');

        // 1. Fetch and populate users on page load
        fetch(API_BASE + '/')
            .then(response => {
                if (!response.ok) throw new Error('Failed to fetch users');
                return response.json();
            })
            .then(data => {
                // Keep the default "Select user..." option, clear any hardcoded ones if necessary
                userSelect.innerHTML = '<option value="">Select user...</option>';
                
                data.users.forEach(username => {
                    const option = document.createElement('option');
                    option.value = username;
                    option.textContent = username;
                    userSelect.appendChild(option);
                });
            })
            .catch(error => console.error('Error loading users:', error));

    // 2. Listen for user selection changes to load their funds
    userSelect.addEventListener('change', (event) => {
        const selectedUser = event.target.value;

        // If they selected the blank placeholder, clear the checkboxes
        if (!selectedUser) {
            checkboxGroup.innerHTML = '<p style="color: #666; font-size: 0.9em;">Select a user to view avaliable funds</p>';
            return;
        }

        // Show a brief loading indicator inside the checkbox group
        checkboxGroup.innerHTML = '<span>Loading funds...</span>';

        // Force absolute path routing and ensure the trailing slash is strictly present
        const cleanUrl = `${API_BASE}/${encodeURIComponent(selectedUser)}/`;

        console.log("Fetching funds from:", cleanUrl); // 👈 Check your browser console to see this path!

        fetch(cleanUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Server responded with status: ${response.status}`);
                }
                return response.json();
            })
            .then(res => {
                // Your API returns {"data": [...]}, let's fallback safely if data is missing
                const funds = res.data || [];
                
                // Clear the container
                checkboxGroup.innerHTML = '';

                if (funds.length === 0) {
                    checkboxGroup.innerHTML = '<span>No funds found for this user.</span>';
                    return;
                }

                // Generate a checkbox for every fund returned by Django
                funds.forEach(fund => {
                    const label = document.createElement('label');
                    label.className = 'checkbox-label';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.name = 'doc-type';
                    checkbox.value = fund;

                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(` ${fund}`));
                    
                    checkboxGroup.appendChild(label);
                });
            })
            .catch(error => {
                console.error('Error loading funds:', error);
                checkboxGroup.innerHTML = '<span style="color: red;">Error loading knowledge sources</span>';
            });
    });
    });

    /* --- Documents: upload, status polling, deletion -------------------- */
    const DOCS_API = 'http://127.0.0.1:8000/api/documents/';
    let docsPollTimer = null;

    function currentUser() {
        return document.getElementById('user').value;
    }

    function escapeHtmlDoc(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function setUploadMessage(text, colour) {
        const el = document.getElementById('upload-msg');
        el.textContent = text;
        el.style.color = colour || '#666';
    }

    // Keep the upload panel in step with whichever user is selected.
    function onUserChangedForDocs() {
        const user = currentUser();
        document.getElementById('docs-locked').style.display = user ? 'none' : 'block';
        document.getElementById('docs-active').style.display = user ? 'block' : 'none';
        setUploadMessage('');
        if (!user) {
            if (docsPollTimer) { clearInterval(docsPollTimer); docsPollTimer = null; }
            return;
        }
        populateUploadFunds(user);
        refreshDocuments();
    }

    function populateUploadFunds(user) {
        const select = document.getElementById('doc-fund');
        fetch(API_BASE + '/' + encodeURIComponent(user) + '/')
            .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
            .then(res => {
                select.innerHTML = '<option value="">No fund (private to you)</option>';
                (res.data || []).forEach(fund => {
                    const opt = document.createElement('option');
                    opt.value = fund;
                    opt.textContent = fund;
                    select.appendChild(opt);
                });
            })
            .catch(err => console.error('Error loading funds for upload:', err));
    }

    async function uploadDocument() {
        const user = currentUser();
        if (!user) { setUploadMessage('Select a user first.', '#c0392b'); return; }

        const fileInput = document.getElementById('doc-file');
        const file = fileInput.files[0];
        if (!file) { setUploadMessage('Choose a PDF to upload.', '#c0392b'); return; }

        const form = new FormData();
        form.append('file', file);
        form.append('user', user);
        form.append('fund', document.getElementById('doc-fund').value);
        form.append('doc_type', document.getElementById('doc-kind').value);

        const btn = document.getElementById('doc-upload-btn');
        btn.disabled = true;
        setUploadMessage('Uploading...');

        try {
            // The server accepts the file and ingests in the background, so a
            // 202 means queued, not searchable - the list below shows progress.
            const response = await fetch(DOCS_API + 'upload/', { method: 'POST', body: form });
            const data = await response.json();
            if (!response.ok) {
                setUploadMessage(data.error || 'Upload failed.', '#c0392b');
            } else {
                setUploadMessage('Queued for ingestion.', '#27ae60');
                fileInput.value = '';
                document.getElementById('doc-kind').value = '';
                refreshDocuments();
            }
        } catch (err) {
            setUploadMessage('Could not reach the server.', '#c0392b');
        } finally {
            btn.disabled = false;
        }
    }

    async function refreshDocuments() {
        const user = currentUser();
        if (!user) return;
        try {
            const response = await fetch(DOCS_API + '?user=' + encodeURIComponent(user));
            if (!response.ok) return;
            const data = await response.json();
            renderDocuments(data.documents || []);
        } catch (err) {
            console.error('Error loading documents:', err);
        }
    }

    function renderDocuments(docs) {
        const list = document.getElementById('doc-list');
        if (!docs.length) {
            list.innerHTML = '<li style="color:#666;font-size:0.95em;">No documents uploaded yet.</li>';
        } else {
            list.innerHTML = docs.map(function (doc) {
                var fund = doc.fund ? escapeHtmlDoc(doc.fund) : 'private';
                var detail;
                if (doc.status === 'ready') {
                    detail = doc.chunk_count + ' chunks';
                } else if (doc.status === 'failed') {
                    detail = escapeHtmlDoc(doc.error || 'failed');
                } else {
                    detail = 'working...';
                }
                return '<li class="doc-item">'
                     + '<div class="doc-name">' + escapeHtmlDoc(doc.filename) + '</div>'
                     + '<div class="doc-meta"><span class="badge badge-' + doc.status + '">'
                     + doc.status + '</span> ' + fund + ' &middot; ' + detail + '</div>'
                     + '<div class="doc-actions"><button onclick="deleteDocument('
                     + doc.id + ')">Delete</button></div>'
                     + '</li>';
            }).join('');
        }

        // Only poll while something is actually in flight.
        var busy = docs.some(function (d) {
            return d.status === 'pending' || d.status === 'processing';
        });
        if (busy && !docsPollTimer) {
            docsPollTimer = setInterval(refreshDocuments, 2500);
        } else if (!busy && docsPollTimer) {
            clearInterval(docsPollTimer);
            docsPollTimer = null;
        }
    }

    async function deleteDocument(id) {
        const user = currentUser();
        if (!user) return;
        if (!confirm('Delete this document and remove it from the search index?')) return;
        try {
            const response = await fetch(
                DOCS_API + id + '/delete/?user=' + encodeURIComponent(user),
                { method: 'DELETE' });
            if (!response.ok) {
                const data = await response.json();
                setUploadMessage(data.error || 'Delete failed.', '#c0392b');
                return;
            }
            setUploadMessage('Document deleted.', '#27ae60');
            refreshDocuments();
        } catch (err) {
            setUploadMessage('Could not reach the server.', '#c0392b');
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('user').addEventListener('change', onUserChangedForDocs);
        onUserChangedForDocs();
    });
</script>

</body>
</html>
